version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: rainxplain_api
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    networks:
      - rainxplain_net

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: rainxplain_frontend
    ports:
      - "8080:80"
    depends_on:
      - api
    restart: unless-stopped
    networks:
      - rainxplain_net

networks:
  rainxplain_net:
    driver: bridge
