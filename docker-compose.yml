version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: rainxplain_api
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    networks:
      - rainxplain_net

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile.dashboard
    container_name: rainxplain_dashboard
    ports:
      - "8501:8501"
    environment:
      - API_URL=http://api:8000
    depends_on:
      - api
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    networks:
      - rainxplain_net

networks:
  rainxplain_net:
    driver: bridge
